# Trigger: the label ship on the release PR (a person); a push to prod; by hand
# Purpose: fast-forwards prod to the release PR's head, then the production deploy with the full gate
# Effect: moves prod; deploys production
# Shipping a service (Node or Python, a template included) to production, in one workflow. Installed as `.github/workflows/kskill-ship.yml`.
#   - Ship: the label `ship` added to the release PR (kskill/release -> prod) by a person with write access, or
#     workflow_dispatch with `ship` = its head SHA: actions/kskill-ship fast-forwards `prod` to that head (never forced,
#     never the merge button, never in the bootstrap phase; a fork ships like any repository). That push starts this workflow again:
#   - Production, on a push to `prod` (or a dispatch on `prod` with no `ship`, to run it again):
#     `.github/workflows/kskill-deploy.yml`, which runs the FULL gate first (a tested tree is never reused on prod).
#   - The release PR refreshed on that push (actions/kskill-release-pr: closed when nothing is left to ship).
# Never runs on any other pull_request event, never from a fork's PR (the job's `if:`). Skipped before any runner where
# the Actions variables KSKILL_CD_PROD / KSKILL_RELEASE_PR are "false" (kheona-skill's kskill-repo-settings.sh).
# Variable: KSKILL_TOKEN_BROKER_URL (the token broker), and the deploy's, all passed on.
# No .kheona.json keys of its own: the deploy's `workflows.cd` and the release PR's `workflows.release`.
name: Kheona Skill · CD · Push to prod and deploy
# Run title: what this run does. The label (or a dispatch naming a head) pushes prod; the push to prod (or a
# dispatch without one) deploys. Any other label starts no job.
run-name: >-
  ${{ ((github.event_name == 'pull_request' && github.event.label.name == 'ship')
        || (github.event_name == 'workflow_dispatch' && inputs.ship != ''))
      && 'Push to prod'
      || ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && 'Deploy to prod'
      || format('Not shipped (label {0})', github.event.label.name)) }}

on:
  workflow_call:
    inputs:
      ship:
        description: Ship the open release PR at this head SHA (empty, on prod = run the production deploy again)
        type: string
        default: ''
      stack:
        description: node, python, flutter or infra (written by the setup command).
        type: string
        required: true
    secrets:
      AWS_ACCESS_KEY_ID:
        required: false
      AWS_SECRET_ACCESS_KEY:
        required: false
      SLACK_WEBHOOK_URL:
        required: false

permissions:
  contents: read

env:
  KSKILL_BOT: ${{ vars.KSKILL_BOT }}
  KSKILL_LIB_REPO: ${{ vars.KSKILL_LIB_REPO }}

jobs:
  ship:
    name: Ship to prod
    if: >-
      (github.event_name == 'pull_request' && github.event.label.name == 'ship'
        && github.event.pull_request.head.ref == 'kskill/release'
        && github.event.pull_request.head.repo.full_name == github.repository)
      || (github.event_name == 'workflow_dispatch' && inputs.ship != '')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: kskill-ship
      cancel-in-progress: false
    # Every write goes through the App token; the job's own token only reads.
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Reach this version's files
        uses: $/.github/actions/kskill-home

      # the App's token for this repository alone: its push to prod starts the production run below.
      - name: Mint the App token
        id: app
        uses: $/.github/actions/kskill-token
        with:
          broker-url: ${{ vars.KSKILL_TOKEN_BROKER_URL }}

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1  # zizmor: ignore[artipacked] -- pushes with the App token
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.app.outputs.token }}

      - name: Ship the release PR
        uses: $/.github/actions/kskill-ship
        with:
          token: ${{ steps.app.outputs.token }}
          github-token: ${{ github.token }}
          actor: ${{ github.event.sender.login }}
          # The head as the person saw it when labelling (or the SHA they typed): what they approved.
          want: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || inputs.ship }}
          label-pr: ${{ github.event_name == 'pull_request' && github.event.pull_request.number || '' }}

  prod:
    name: Production
    if: >-
      vars.KSKILL_CD_PROD != 'false' &&
      (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.ship == ''))
    uses: ./.github/workflows/kskill-deploy.yml
    with:
      stack: ${{ inputs.stack }}
      environment: ${{ github.event_name == 'workflow_dispatch' && 'prod' || '' }}
    permissions:
      contents: read
      actions: read
      id-token: write
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  # the draft release PR kskill/release -> prod (actions/kskill-release-pr). Skipped before any runner where it
  # is off (the Actions variable KSKILL_RELEASE_PR, written from .kheona.json by kheona-skill's kskill-repo-settings.sh).
  release-pr:
    name: Open or update the release PR
    if: vars.KSKILL_RELEASE_PR != 'false' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # One at a time, a newer run superseding an older one (main's push, prod's, the doctor's daily refresh).
    concurrency:
      group: kskill-release-pr
      cancel-in-progress: true
    # Every write goes through the App token; the job's own token only reads.
    permissions:
      contents: read
      id-token: write
    env:
      HAS_APP: ${{ vars.KSKILL_TOKEN_BROKER_URL != '' }}
    steps:
      - name: Reach this version's files
        uses: $/.github/actions/kskill-home

      # the App's token for this repository alone: a push, PR or merge made with it starts workflows.
      - name: Mint the App token
        id: app
        if: env.HAS_APP == 'true'
        uses: $/.github/actions/kskill-token
        with:
          broker-url: ${{ vars.KSKILL_TOKEN_BROKER_URL }}

      # main, whatever pushed: the script and the settings are main's, and a push to prod may predate them.
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1  # zizmor: ignore[artipacked] -- pushes with the App token
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.app.outputs.token || github.token }}

      - name: Prepare the release PR
        uses: $/.github/actions/kskill-release-pr
        with:
          token: ${{ steps.app.outputs.token }}
          github-token: ${{ github.token }}
