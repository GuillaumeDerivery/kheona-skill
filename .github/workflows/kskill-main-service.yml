# Trigger: a push to main (a merged PR)
# Purpose: the gate once (a green PR run of the same tree reused), then the staging deploy
# Effect: deploys staging
# Everything a push to `main` starts in a service (Node or Python, a template included), in one run. Installed as
# `.github/workflows/kskill-main.yml` (the stack-neutral path, like kskill-ci.yml).
#   1. CI: the stack's gate, `.github/workflows/kskill-ci.yml`, called once. A green `Kheona Skill · PR` run of the same
#      tree (a squash merge of an up-to-date PR) is reused: only its first job runs (kskill-tested-tree.sh).
#   2. Staging: `.github/workflows/kskill-deploy.yml` (`gate: false`: it needs this run's CI), where
#      `workflows.cd.staging` is set (skipped before any runner where the Actions variable KSKILL_CD_STAGING is "false").
#      With workflows.cd.target "custom", its outputs hand the deploy to the caller's `custom` job.
# The release PR is release-please's (kskill-release-please.yml); production is the version tag merging it creates
# (kskill-deploy.yml). A passed run of this workflow is what that release checks on the commit before it.
# Never runs from a pull request.
# Variable: KSKILL_TOKEN_BROKER_URL (the token broker), and the deploy's (AWS_ACCESS_KEY_ID,
# AWS_SECRET_ACCESS_KEY, SLACK_WEBHOOK_URL), all passed on. No .kheona.json keys of its own: the deploy's `workflows.cd`.
name: Kheona Skill · Main

on:
  workflow_call:
    inputs:
      stack:
        description: node, python, flutter or infra (written by the setup command).
        type: string
        required: true
    secrets:
      AWS_ACCESS_KEY_ID:
        required: false
      AWS_SECRET_ACCESS_KEY:
        required: false
      SLACK_WEBHOOK_URL:
        required: false
    outputs:
      deploy:
        description: '"custom" when the repository''s own workflow is to deploy staging now; else empty.'
        value: ${{ jobs.staging.outputs.deploy }}
      environment:
        description: staging, when it deployed.
        value: ${{ jobs.staging.outputs.environment }}
      version:
        description: Always empty here (staging has no version).
        value: ${{ jobs.staging.outputs.version }}

permissions:
  contents: read

env:
  KSKILL_BOT: ${{ vars.KSKILL_BOT }}
  KSKILL_LIB_REPO: ${{ vars.KSKILL_LIB_REPO }}

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/kskill-ci.yml
    # The staging deploy builds the image; the gate builds it only where no staging deploy follows.
    with:
      stack: ${{ inputs.stack }}
      image: ${{ vars.KSKILL_CD_STAGING == 'false' }}
    permissions:
      contents: read
      actions: read            # the tested-tree lookup: a green PR run of this tree is reused (kskill-tested-tree.sh)
      id-token: write

  staging:
    name: Staging
    needs: ci
    if: vars.KSKILL_CD_STAGING != 'false'
    uses: ./.github/workflows/kskill-deploy.yml
    with:
      stack: ${{ inputs.stack }}
      gate: false
    permissions:
      contents: read
      actions: read
      pull-requests: read      # the deploy's release check (it decides staging from the ref)
      id-token: write
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

