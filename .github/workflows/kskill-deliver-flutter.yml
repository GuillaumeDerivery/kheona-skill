# This Source Code Form is subject to the terms of the Mozilla Public License, v. 2.0. If a copy of the MPL was
# not distributed with this file, You can obtain one at https://mozilla.org/MPL/2.0/.
# Trigger: a version tag's push (the release); by hand on a tag (the same release again) or on main (a test build)
# Purpose: checks the release, runs the full gate, then builds, signs and uploads the app to TestFlight and Google Play
# Effect: store uploads
# Ships a Flutter app to TestFlight and to Google Play, signed, from CI, through the repository's caller
# (kskill-deliver.yml), which pins this repository by its immutable version tag. What may run comes from the ref
# alone (.github/scripts/kskill-release-check.sh, the same check as the services' production deploy):
#   - a version tag vX.Y.Z: merging the release PR (a person) tags it with the App token; the check asks for a tag on
#     main, a release PR merged by a person, Main passed on the commit before. A dispatch on a tag needs a published
#     release and a person with write access. A store build cannot be taken back: an app fixes forward, it never rolls back.
#   - a dispatch on main: a test build, named after the next patch (v1.4.0 released: 1.4.1, kskill-build-name.sh); a
#     test build of a commit a release tag points at is refused.
#   - anything else: refused. No pull_request trigger, so a PR or a fork can never reach it.
#   - dry_run (kheona-skill's self-test, from a pull request too): the release check, the settings, then each lane up
#     to signing (checkout, the secrets check, which only reports, the build number and name), then stops: no gate, no
#     toolchain, nothing built, signed or uploaded. Both lanes run on Linux then: no macOS minutes.
# Both store lanes `needs:` the repository's gate, `Kheona Skill · CI`, run in full inside this run.
# Never: commits back, looks a build number up from a store, carries a paths-ignore.
#
# The build number is the commit count of the ref on main (+ an offset), the same on both stores
# (kskill-build-number.sh): main is linear (squash merges), so it only grows. A test build of the very commit a release
# shipped gets that release's number, and the stores refuse it.
# The repository variable BUILD_NUMBER_OVERRIDE, when set, replaces it for one run (re-ship an unchanged commit).
# What is app-specific and stays in the repository, behind a stable hook: `android/fastlane/Fastfile` and
# `ios/fastlane/Fastfile` (+ Appfiles) own bundle/package ids, team id, Play track, ABIs, signing settings and
# the .ipa name. The workflow runs `cd android && fastlane <android.lane>` and `cd ios && fastlane <ios.lane>`
# with BUILD_NUMBER, BUILD_NAME (optional for the lane: `--build-name`), CM_KEYSTORE_PATH, CM_KEYSTORE_PASSWORD, CM_KEY_ALIAS, CM_KEY_PASSWORD,
# PLAY_STORE_JSON_KEY_PATH, ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_FILEPATH, SENTRY_ENVIRONMENT in the environment (the
# lane compiles it in with --dart-define=SENTRY_ENVIRONMENT=..., read by lib/core/config/app_config.dart, ).
# The Android lane must
# leave one .aab under build/app/outputs/bundle/, the iOS lane one .ipa under ios/build/.
# The Flutter version is read from `.fvmrc` (`{"flutter": "x.y.z"}`).
#
# .kheona.json, all optional (`workflows.cd.*`):
#   enabled             bool    true    false: the workflow does nothing (an app shipped by another service).
#   android.enabled     bool    true    run the Play lane.
#   android.lane        string  "beta"  fastlane lane run in android/.
#   android.java        string  "17"    Temurin JDK for Gradle.
#   android.ruby        string  "3.3"   Ruby that runs fastlane on the Android runner.
#   android.sentryEnvironment string "staging"  SENTRY_ENVIRONMENT of the Play lane: staging (internal track) or prod (store).
#   ios.enabled         bool    true    run the TestFlight lane.
#   ios.lane            string  "beta"  fastlane lane run in ios/.
#   ios.xcode           string  ""      Xcode selected on the runner (/Applications/Xcode_<v>.app); "" = image default.
#   ios.sentryEnvironment string "staging"  SENTRY_ENVIRONMENT of the iOS lane: staging (TestFlight) or prod (App Store).
#   buildNumber.offset  int     0       added to the commit count (an app whose store already holds higher numbers).
#   sentry.enabled      bool    false   upload debug symbols with `dart run sentry_dart_plugin` after each build.
#   sentry.org          string  -       Sentry organisation slug (required when sentry.enabled).
#   sentry.project      string  -       Sentry project slug (required when sentry.enabled).
#   sentry.appId        string  -       release prefix the app reports, `<appId>@<version>+<build>` (required when enabled).
#   sentry.url          string  ""      Sentry base URL (e.g. https://de.sentry.io); "" = the CLI default.
# Secrets: KSKILL_TOKEN_BROKER_URL (passed to the gate), ANDROID_KEYSTORE_BASE64, CM_KEYSTORE_PASSWORD, CM_KEY_ALIAS, CM_KEY_PASSWORD,
# PLAY_STORE_JSON_KEY_BASE64, IOS_DIST_CERTIFICATE_P12_BASE64, IOS_DIST_CERTIFICATE_PASSWORD, ASC_KEY_ID,
# ASC_ISSUER_ID, ASC_API_KEY_BASE64, SENTRY_AUTH_TOKEN (optional: missing = a warning, symbols not uploaded).
name: Kheona Skill · Deliver

on:
  workflow_call:
    inputs:
      stack:
        description: Empty (the default) lets the gate read it from the repository (kskill-ci.yml); an older generation of callers still passes its own.
        type: string
        default: ''
      dry_run:
        description: The release check, the settings and each lane up to signing, from any ref, a pull request's included; no gate, nothing built, signed or uploaded (kheona-skill's self-test).
        type: boolean
        default: false
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: false
      ASC_API_KEY_BASE64:
        required: false
      ASC_ISSUER_ID:
        required: false
      ASC_KEY_ID:
        required: false
      CM_KEYSTORE_PASSWORD:
        required: false
      CM_KEY_ALIAS:
        required: false
      CM_KEY_PASSWORD:
        required: false
      IOS_DIST_CERTIFICATE_P12_BASE64:
        required: false
      IOS_DIST_CERTIFICATE_PASSWORD:
        required: false
      PLAY_STORE_JSON_KEY_BASE64:
        required: false
      SENTRY_AUTH_TOKEN:
        required: false

# One delivery at a time, whatever the ref: two would race for the same build numbers.
concurrency:
  group: kskill-deliver-flutter
  cancel-in-progress: false

permissions:
  contents: read

env:
  KSKILL_BOT: ${{ vars.KSKILL_BOT }}
  KSKILL_LIB_REPO: ${{ vars.KSKILL_LIB_REPO }}
  # Exact pin: an unpinned `gem install fastlane` moved a working sigh() call onto a breaking release overnight.
  FASTLANE_VERSION: "2.240.1"
  FASTLANE_SKIP_UPDATE_CHECK: "1"
  FASTLANE_HIDE_CHANGELOG: "1"
  FASTLANE_DISABLE_COLORS: "1"

jobs:
  config:
    name: Read the delivery settings
    if: github.event_name != 'pull_request' || inputs.dry_run
    runs-on: ubuntu-24.04
    timeout-minutes: 50     # the release check waits up to 45 min for Main on the commit before
    permissions:
      contents: read
      pull-requests: read      # the release check: the release PR that made the tagged commit
      actions: read            # the release check: Main's run on the commit before the release
    outputs:
      environment: ${{ steps.env.outputs.environment }}
      version: ${{ steps.env.outputs.version }}
      enabled: ${{ steps.read.outputs.enabled }}
      android: ${{ steps.read.outputs.android }}
      android_lane: ${{ steps.read.outputs.android_lane }}
      android_environment: ${{ steps.read.outputs.android_environment }}
      java: ${{ steps.read.outputs.java }}
      ruby: ${{ steps.read.outputs.ruby }}
      ios: ${{ steps.read.outputs.ios }}
      ios_lane: ${{ steps.read.outputs.ios_lane }}
      ios_environment: ${{ steps.read.outputs.ios_environment }}
      xcode: ${{ steps.read.outputs.xcode }}
      offset: ${{ steps.read.outputs.offset }}
      sentry: ${{ steps.read.outputs.sentry }}
      sentry_org: ${{ steps.read.outputs.sentry_org }}
      sentry_project: ${{ steps.read.outputs.sentry_project }}
      sentry_app_id: ${{ steps.read.outputs.sentry_app_id }}
      sentry_url: ${{ steps.read.outputs.sentry_url }}
    steps:
      - name: Reach this version's files
        uses: $/.github/actions/kskill-home

      # A tag only when it is a person's release (or a person's dispatch on a published one); main only by hand.
      - name: Check the release
        id: env
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          ACTOR: ${{ github.triggering_actor }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$EVENT_NAME" = push ] && [ "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH" ] && [ "$DRY_RUN" != true ]; then
            echo "::error::A push to $DEFAULT_BRANCH delivers nothing: a release is a version tag; a test build is started by hand."
            exit 1
          fi
          bash "$KSKILL_HOME/.github/scripts/kskill-release-check.sh"

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read .kheona.json
        id: read
        run: |
          json='{}'
          if [ -f .kheona.json ]; then json="$(cat .kheona.json)"; fi
          get() { # get <jq path> <default>: the value as a string, the default when absent or null
            jq -r --arg d "$2" "($1) as \$v | if \$v == null then \$d else (\$v | tostring) end" <<<"$json"
          }
          fail() { echo "::error::.kheona.json $1"; exit 1; }

          enabled="$(get .workflows.cd.enabled true)"
          case "$enabled" in true|false) ;; *) fail "workflows.cd.enabled must be true or false, got '$enabled'." ;; esac
          echo "enabled=$enabled" >> "$GITHUB_OUTPUT"
          if [ "$enabled" = false ]; then
            echo "::notice::workflows.cd.enabled is false: this repository is not delivered by this workflow."
            exit 0
          fi

          android="$(get .workflows.cd.android.enabled true)"
          ios="$(get .workflows.cd.ios.enabled true)"
          sentry="$(get .workflows.cd.sentry.enabled false)"
          for pair in "android.enabled=$android" "ios.enabled=$ios" "sentry.enabled=$sentry"; do
            case "${pair#*=}" in true|false) ;; *) fail "workflows.cd.${pair%%=*} must be true or false, got '${pair#*=}'." ;; esac
          done
          android_lane="$(get .workflows.cd.android.lane beta)"
          ios_lane="$(get .workflows.cd.ios.lane beta)"
          for lane in "$android_lane" "$ios_lane"; do
            [[ "$lane" =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || fail "fastlane lane names are letters, digits and _, got '$lane'."
          done
          # a mobile app's internal builds (TestFlight, Play internal) report as staging, the store release as prod.
          android_environment="$(get .workflows.cd.android.sentryEnvironment staging)"
          ios_environment="$(get .workflows.cd.ios.sentryEnvironment staging)"
          for pair in "android=$android_environment" "ios=$ios_environment"; do
            case "${pair#*=}" in staging|prod) ;; *) fail "workflows.cd.${pair%%=*}.sentryEnvironment must be staging or prod, got '${pair#*=}'." ;; esac
          done
          java="$(get .workflows.cd.android.java 17)"
          ruby="$(get .workflows.cd.android.ruby 3.3)"
          xcode="$(get .workflows.cd.ios.xcode '')"
          for version in "$java" "$ruby"; do
            [[ "$version" =~ ^[0-9]+(\.[0-9]+)*$ ]] || fail "android.java / android.ruby must be a version, got '$version'."
          done
          [[ -z "$xcode" || "$xcode" =~ ^[0-9]+(\.[0-9]+)*$ ]] || fail "workflows.cd.ios.xcode must be a version, got '$xcode'."
          offset="$(get .workflows.cd.buildNumber.offset 0)"
          [[ "$offset" =~ ^[0-9]+$ ]] || fail "workflows.cd.buildNumber.offset must be a non-negative integer, got '$offset'."

          sentry_org="$(get .workflows.cd.sentry.org '')"
          sentry_project="$(get .workflows.cd.sentry.project '')"
          sentry_app_id="$(get .workflows.cd.sentry.appId '')"
          sentry_url="$(get .workflows.cd.sentry.url '')"
          if [ "$sentry" = true ]; then
            for pair in "org=$sentry_org" "project=$sentry_project" "appId=$sentry_app_id"; do
              [[ "${pair#*=}" =~ ^[A-Za-z0-9._-]+$ ]] || fail "workflows.cd.sentry.${pair%%=*} is required when sentry.enabled is true (slug characters only)."
            done
            [[ -z "$sentry_url" || "$sentry_url" =~ ^https://[A-Za-z0-9.-]+/?$ ]] || fail "workflows.cd.sentry.url must be an https:// base URL, got '$sentry_url'."
          fi
          if [ "$android" = false ] && [ "$ios" = false ]; then
            fail "enables neither store lane: set workflows.cd.enabled to false instead."
          fi

          {
            echo "android=$android"; echo "android_lane=$android_lane"; echo "java=$java"; echo "ruby=$ruby"
            echo "android_environment=$android_environment"; echo "ios_environment=$ios_environment"
            echo "ios=$ios"; echo "ios_lane=$ios_lane"; echo "xcode=$xcode"; echo "offset=$offset"
            echo "sentry=$sentry"; echo "sentry_org=$sentry_org"; echo "sentry_project=$sentry_project"
            echo "sentry_app_id=$sentry_app_id"; echo "sentry_url=$sentry_url"
          } >> "$GITHUB_OUTPUT"
          echo "Android: $android (lane $android_lane, $android_environment), iOS: $ios (lane $ios_lane, $ios_environment, Xcode ${xcode:-image default}), Sentry upload: $sentry, build number offset: $offset."

  # The gate: the same jobs a pull request runs, inside this run, so nothing ships from an unverified commit.
  ci:
    name: Run the gate
    needs: config
    if: needs.config.outputs.enabled == 'true' && !inputs.dry_run
    uses: ./.github/workflows/kskill-ci.yml
    permissions:
      contents: read
      actions: read            # the gate's tested-tree lookup (never reused here: only a push to main reuses)
      id-token: write
    with:
      stack: ${{ inputs.stack }}

  android:
    name: Android → Google Play
    needs: [config, ci]
    # a dry run skips the gate: the lane then runs on a skipped `ci`, up to signing.
    if: >-
      !cancelled() && needs.config.outputs.android == 'true'
      && (needs.ci.result == 'success' || (inputs.dry_run && needs.ci.result == 'skipped'))
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Reach this version's files
        uses: $/.github/actions/kskill-home

      # fetch-depth: 0 is load-bearing: the build number is the commit count, and depth 1 counts 1.
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # fail in seconds with the names, not fifteen minutes later at signing.
      - name: Check the signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          CM_KEYSTORE_PASSWORD: ${{ secrets.CM_KEYSTORE_PASSWORD }}
          CM_KEY_ALIAS: ${{ secrets.CM_KEY_ALIAS }}
          CM_KEY_PASSWORD: ${{ secrets.CM_KEY_PASSWORD }}
          PLAY_STORE_JSON_KEY_BASE64: ${{ secrets.PLAY_STORE_JSON_KEY_BASE64 }}
          REPO: ${{ github.repository }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          missing=()
          for name in ANDROID_KEYSTORE_BASE64 CM_KEYSTORE_PASSWORD CM_KEY_ALIAS CM_KEY_PASSWORD PLAY_STORE_JSON_KEY_BASE64; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ ${#missing[@]} -gt 0 ] && [ "$DRY_RUN" = true ]; then
            echo "::notice::Dry run: a delivery would stop here, missing ${missing[*]}."
          elif [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing repository secret(s): ${missing[*]}. Set them with: gh secret set <NAME> --repo $REPO"
            exit 1
          fi

      - name: Derive the build number
        env:
          BUILD_NUMBER_OVERRIDE: ${{ vars.BUILD_NUMBER_OVERRIDE }}
          KSKILL_BUILD_NUMBER_OFFSET: ${{ needs.config.outputs.offset }}
        run: bash "$KSKILL_HOME/.github/scripts/kskill-build-number.sh"

      # The release's version, or for a test build the next patch (a store closes a released version). A lane that
      # does not pass BUILD_NAME on builds pubspec.yaml's version, which the store refuses once that version shipped.
      - name: Derive the build name
        # kheona-skill's own release commit is tagged, which a test build refuses: a dry run reports it and goes on.
        continue-on-error: ${{ inputs.dry_run }}
        env:
          VERSION: ${{ needs.config.outputs.version }}
        run: |
          bash "$KSKILL_HOME/.github/scripts/kskill-build-name.sh"
          grep -q BUILD_NAME android/fastlane/Fastfile || echo "::warning::android/fastlane/Fastfile never reads BUILD_NAME: the build is named after pubspec.yaml's version. Pass --build-name \"\$BUILD_NAME\" to flutter build."

      # A dry run ends here, before the toolchain, the keystore and the build: what came before is the delivery's own
      # wiring, what comes after needs the app and its signing secrets.
      - name: Stop here on a dry run
        if: inputs.dry_run
        env:
          LANE: ${{ needs.config.outputs.android_lane }}
        run: |
          echo "Dry run, Android lane $LANE stops before signing at build ${BUILD_NUMBER:-?} (${BUILD_NAME:-?}): nothing built, signed or uploaded."

      # The runner's disk is ~95 % full after a release build, and the post-job cache saves then fail the job with
      # "No space left on device" after the upload succeeded. The image's .NET, GHC, CodeQL, Swift and Boost are not
      # used here (the Android SDK is kept).
      - name: Free disk space
        if: ${{ !inputs.dry_run }}
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
          docker image prune -af >/dev/null 2>&1 || true
          df -h /

      - name: Set up Flutter
        if: ${{ !inputs.dry_run }}
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true

      - name: Set up Java
        if: ${{ !inputs.dry_run }}
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ needs.config.outputs.java }}

      - name: Set up Ruby
        if: ${{ !inputs.dry_run }}
        uses: ruby/setup-ruby@e1bd6146574da5e0795075b5319b300edb30c5b0 # v1.333.0
        with:
          ruby-version: ${{ needs.config.outputs.ruby }}
          bundler-cache: false

      - name: Install fastlane
        if: ${{ !inputs.dry_run }}
        run: gem install fastlane -N -v "$FASTLANE_VERSION"

      # Flutter's template gradle.properties lets the Gradle and Kotlin daemons each take -Xmx8G on a ~7.8 GiB
      # runner, which gets the job OOM-killed mid-build ("The runner has received a shutdown signal").
      # GRADLE_USER_HOME/gradle.properties wins over the project's file, so this caps CI only.
      - name: Cap Gradle memory for the runner
        if: ${{ !inputs.dry_run }}
        run: |
          mkdir -p ~/.gradle
          cat > ~/.gradle/gradle.properties <<'PROPS'
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError
          kotlin.daemon.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m
          org.gradle.workers.max=2
          org.gradle.caching=true
          org.gradle.vfs.watch=false
          PROPS
          cat ~/.gradle/gradle.properties

      - name: Install dependencies
        if: ${{ !inputs.dry_run }}
        run: flutter pub get --enforce-lockfile

      # Dependencies change only with the build files: a content key. The task-output cache must absorb every
      # build, and actions/cache only saves on a key miss: a run-id key, restored from the newest previous one.
      - name: Cache Gradle dependencies
        if: ${{ !inputs.dry_run }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/caches/jars-*
            ~/.gradle/caches/transforms-*
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-deps-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-deps-

      - name: Cache the Gradle build cache
        if: ${{ !inputs.dry_run }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.gradle/caches/build-cache-1
          key: ${{ runner.os }}-gradle-build-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-gradle-build-

      # A plugin's native build needs CMake, which the SDK manager otherwise re-installs on every run.
      - name: Cache the Android SDK CMake
        if: ${{ !inputs.dry_run }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /usr/local/lib/android/sdk/cmake
          key: ${{ runner.os }}-android-cmake-3.22.1

      - name: Decode the keystore
        if: ${{ !inputs.dry_run }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          KEYSTORE_PATH="$RUNNER_TEMP/release.keystore"
          echo -n "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          [ -s "$KEYSTORE_PATH" ] || { echo "::error::ANDROID_KEYSTORE_BASE64 decoded to an empty keystore."; exit 1; }
          echo "CM_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Decode the Play Console key
        if: ${{ !inputs.dry_run }}
        env:
          PLAY_STORE_JSON_KEY_BASE64: ${{ secrets.PLAY_STORE_JSON_KEY_BASE64 }}
        run: |
          JSON_KEY_PATH="$RUNNER_TEMP/play-store-key.json"
          echo -n "$PLAY_STORE_JSON_KEY_BASE64" | base64 --decode > "$JSON_KEY_PATH"
          python3 -c 'import json,sys; json.load(open(sys.argv[1]))' "$JSON_KEY_PATH" \
            || { echo "::error::PLAY_STORE_JSON_KEY_BASE64 did not decode to valid JSON."; exit 1; }
          echo "PLAY_STORE_JSON_KEY_PATH=$JSON_KEY_PATH" >> "$GITHUB_ENV"

      # a build that dies silently mid-step is resource exhaustion far more often than anything else.
      - name: Print resources before the build
        if: ${{ !inputs.dry_run }}
        run: |
          nproc || true
          free -h || true
          df -h /

      - name: Build and upload to Google Play
        if: ${{ !inputs.dry_run }}
        env:
          CM_KEYSTORE_PASSWORD: ${{ secrets.CM_KEYSTORE_PASSWORD }}
          CM_KEY_ALIAS: ${{ secrets.CM_KEY_ALIAS }}
          CM_KEY_PASSWORD: ${{ secrets.CM_KEY_PASSWORD }}
          SENTRY_ENVIRONMENT: ${{ needs.config.outputs.android_environment }}
          LANE: ${{ needs.config.outputs.android_lane }}
        run: cd android && fastlane "$LANE"

      - name: Print resources after the build
        if: always() && !inputs.dry_run
        run: |
          free -h || true
          df -h /

      # same job as the build, whose output disappears with the runner. Not always(): a failed build has
      # nothing worth uploading.
      - name: Upload debug symbols to Sentry
        if: success() && needs.config.outputs.sentry == 'true' && !inputs.dry_run
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          KSKILL_SENTRY_ORG: ${{ needs.config.outputs.sentry_org }}
          KSKILL_SENTRY_PROJECT: ${{ needs.config.outputs.sentry_project }}
          KSKILL_SENTRY_APP_ID: ${{ needs.config.outputs.sentry_app_id }}
          KSKILL_SENTRY_URL: ${{ needs.config.outputs.sentry_url }}
        run: bash "$KSKILL_HOME/.github/scripts/kskill-flutter-sentry-upload.sh"

      - name: Report what shipped
        if: success() && !inputs.dry_run
        run: bash "$KSKILL_HOME/.github/scripts/kskill-flutter-report-shipped.sh" android

      - name: Keep the App Bundle
        if: success() && !inputs.dry_run
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-release-aab
          path: build/app/outputs/bundle/*/*.aab
          if-no-files-found: error
          retention-days: 14

  ios:
    name: iOS → TestFlight
    needs: [config, ci]
    if: >-
      !cancelled() && needs.config.outputs.ios == 'true'
      && (needs.ci.result == 'success' || (inputs.dry_run && needs.ci.result == 'skipped'))
    # a dry run stops before anything needs a Mac: Linux, at a tenth of the minutes.
    runs-on: ${{ inputs.dry_run && 'ubuntu-24.04' || 'macos-26' }}
    # macOS bills at 10x: this bounds what one hung run costs. The lane's real work is ~20-30 minutes cold.
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - name: Reach this version's files
        uses: $/.github/actions/kskill-home

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check the signing secrets
        env:
          IOS_DIST_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_DIST_CERTIFICATE_P12_BASE64 }}
          IOS_DIST_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DIST_CERTIFICATE_PASSWORD }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_API_KEY_BASE64: ${{ secrets.ASC_API_KEY_BASE64 }}
          REPO: ${{ github.repository }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          missing=()
          for name in IOS_DIST_CERTIFICATE_P12_BASE64 IOS_DIST_CERTIFICATE_PASSWORD ASC_KEY_ID ASC_ISSUER_ID ASC_API_KEY_BASE64; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ ${#missing[@]} -gt 0 ] && [ "$DRY_RUN" = true ]; then
            echo "::notice::Dry run: a delivery would stop here, missing ${missing[*]}."
          elif [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing repository secret(s): ${missing[*]}. Set them with: gh secret set <NAME> --repo $REPO"
            exit 1
          fi

      # The image is pinned, the Xcode inside it is not: GitHub moves the default during an image's lifetime, and
      # signing breaks with an error that never names Xcode. Selecting it makes that day a .kheona.json change.
      - name: Select Xcode
        if: ${{ !inputs.dry_run }}
        env:
          XCODE_VERSION: ${{ needs.config.outputs.xcode }}
        run: |
          if [ -n "$XCODE_VERSION" ]; then
            XCODE_APP="/Applications/Xcode_${XCODE_VERSION}.app"
            if [ ! -d "$XCODE_APP" ]; then
              echo "::error::$XCODE_APP is not on this runner image. Available:"
              ls -d /Applications/Xcode_*.app 2>/dev/null || true
              exit 1
            fi
            sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          else
            echo "::notice::workflows.cd.ios.xcode is not set: building with the image's default Xcode."
          fi
          xcodebuild -version
          xcode-select -p

      - name: Derive the build number
        env:
          BUILD_NUMBER_OVERRIDE: ${{ vars.BUILD_NUMBER_OVERRIDE }}
          KSKILL_BUILD_NUMBER_OFFSET: ${{ needs.config.outputs.offset }}
        run: bash "$KSKILL_HOME/.github/scripts/kskill-build-number.sh"

      # The release's version, or for a test build the next patch (a store closes a released version). A lane that
      # does not pass BUILD_NAME on builds pubspec.yaml's version, which the store refuses once that version shipped.
      - name: Derive the build name
        # kheona-skill's own release commit is tagged, which a test build refuses: a dry run reports it and goes on.
        continue-on-error: ${{ inputs.dry_run }}
        env:
          VERSION: ${{ needs.config.outputs.version }}
        run: |
          bash "$KSKILL_HOME/.github/scripts/kskill-build-name.sh"
          grep -q BUILD_NAME ios/fastlane/Fastfile || echo "::warning::ios/fastlane/Fastfile never reads BUILD_NAME: the build is named after pubspec.yaml's version. Pass --build-name \"\$BUILD_NAME\" to flutter build."

      - name: Stop here on a dry run
        if: inputs.dry_run
        env:
          LANE: ${{ needs.config.outputs.ios_lane }}
        run: |
          echo "Dry run, iOS lane $LANE stops before signing at build ${BUILD_NUMBER:-?} (${BUILD_NAME:-?}): nothing built, signed or uploaded."

      - name: Set up Flutter
        if: ${{ !inputs.dry_run }}
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true

      - name: Install fastlane
        if: ${{ !inputs.dry_run }}
        run: |
          gem install fastlane -N -v "$FASTLANE_VERSION"
          fastlane --version | tail -n 3

      - name: Install dependencies
        if: ${{ !inputs.dry_run }}
        run: flutter pub get --enforce-lockfile

      # GitHub's "Installing an Apple certificate on macOS runners" recipe; the keychain is deleted at the end.
      - name: Import the distribution certificate
        if: ${{ !inputs.dry_run }}
        env:
          CERTIFICATE_BASE64: ${{ secrets.IOS_DIST_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_DIST_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -base64 24)
          CERTIFICATE_PATH="$RUNNER_TEMP/distribution.p12"

          echo -n "$CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          [ -s "$CERTIFICATE_PATH" ] || { echo "::error::IOS_DIST_CERTIFICATE_P12_BASE64 decoded to an empty file."; exit 1; }

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          # shellcheck disable=SC2046 # why: one keychain path per word is the intended split
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/"//g')
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # A .p12 without its private key imports fine and only fails 20 minutes later at codesign.
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -q "Apple Distribution" \
            || { echo "::error::No 'Apple Distribution' identity in the imported certificate."; exit 1; }

      - name: Write the App Store Connect key
        if: ${{ !inputs.dry_run }}
        env:
          ASC_API_KEY_BASE64: ${{ secrets.ASC_API_KEY_BASE64 }}
        run: |
          ASC_KEY_PATH="$RUNNER_TEMP/asc_api_key.p8"
          echo -n "$ASC_API_KEY_BASE64" | base64 --decode > "$ASC_KEY_PATH"
          grep -q "BEGIN PRIVATE KEY" "$ASC_KEY_PATH" \
            || { echo "::error::ASC_API_KEY_BASE64 did not decode to a .p8 private key."; exit 1; }
          echo "ASC_KEY_FILEPATH=$ASC_KEY_PATH" >> "$GITHUB_ENV"

      - name: Print resources before the build
        if: ${{ !inputs.dry_run }}
        run: |
          vm_stat || true
          df -h /

      - name: Build and upload to TestFlight
        if: ${{ !inputs.dry_run }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          SENTRY_ENVIRONMENT: ${{ needs.config.outputs.ios_environment }}
          LANE: ${{ needs.config.outputs.ios_lane }}
        run: cd ios && fastlane "$LANE"

      - name: Print resources after the build
        if: always() && !inputs.dry_run
        run: |
          vm_stat || true
          df -h /

      - name: Upload debug symbols to Sentry
        if: success() && needs.config.outputs.sentry == 'true' && !inputs.dry_run
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          KSKILL_SENTRY_ORG: ${{ needs.config.outputs.sentry_org }}
          KSKILL_SENTRY_PROJECT: ${{ needs.config.outputs.sentry_project }}
          KSKILL_SENTRY_APP_ID: ${{ needs.config.outputs.sentry_app_id }}
          KSKILL_SENTRY_URL: ${{ needs.config.outputs.sentry_url }}
        run: bash "$KSKILL_HOME/.github/scripts/kskill-flutter-sentry-upload.sh"

      - name: Report what shipped
        if: success() && !inputs.dry_run
        run: bash "$KSKILL_HOME/.github/scripts/kskill-flutter-report-shipped.sh" ios

      # xcodebuild's real error is in gym's log, not the truncated console. upload-artifact does not expand `~`.
      - name: Collect the build logs
        if: failure()
        run: |
          mkdir -p "$GITHUB_WORKSPACE/ci-logs"
          cp -R ~/Library/Logs/gym "$GITHUB_WORKSPACE/ci-logs/gym" 2>/dev/null || true

      - name: Keep the build logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-build-logs
          path: ci-logs
          if-no-files-found: ignore
          retention-days: 7

      - name: Delete the keychain
        if: always() && !inputs.dry_run
        run: security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" || true
