# not distributed with this file, You can obtain one at https://mozilla.org/MPL/2.0/.
# Trigger: called by Kheona Skill · Main on a push to main (staging); a version tag's push (production); by hand
# Purpose: checks the release, runs the gate, builds the image, pushes it to ECR and rolls it out on EKS
# Effect: deploys staging or production
# Deploys a backend container (Node or Python). The environment comes from the ref, never from an input
# (.github/scripts/kskill-release-check.sh):
#   - `main` is staging: `Kheona Skill · Main` (kskill-main.yml) calls this file on a push, after its own gate
#     (`gate: false`, never honoured on a tag); a dispatch on `main` deploys staging again.
#   - a version tag is production: merging the release PR (a person, kskill-release-please.yml) tags vX.Y.Z with the
#     App token, and that tag's push starts this file through the repository's caller, which pins this repository
#     by its immutable version tag (the production role trusts only this file at a v2 tag: job_workflow_ref).
#     The release check runs first: version tag, on main, a release PR merged by a person, staging passed on the
#     commit before. When the release commit changes nothing but versions (kskill-release-image.sh) and ECR holds the
#     image staging built from the commit before, production runs that very image: no gate (Main passed on it), no
#     build, only the version tag added in ECR. Otherwise the FULL gate, then a build.
#   - a rollback is this workflow started by hand on an earlier tag (`gh workflow run kskill-deploy.yml --ref v1.3.0`):
#     the check asks for a published release and a person with write access. The release's image digest (recorded
#     in its notes by the deploy) is deployed as is when ECR still has it: no gate, no build. Otherwise it runs in full.
#   - anything else (another branch, another tag, a pull request but as a dry run) deploys nothing.
# The version is never built into the image: the deploy sets APP_VERSION on every deployment and cron job
# (kskill-app-version.sh): X.Y.Z in production, <last release>+<commits since>.<short commit> on staging. The image
# carries only its commit (GIT_SHA), so one image shows the same commit on both, and each environment's own version.
# The image is deployed by digest, never by a tag (tags in a shared ECR repository can be overwritten); production
# images are also tagged with their version, so an ECR lifecycle rule can keep them.
# Where it deploys, `workflows.cd.target`: "eks" (the default: .github/actions/kskill-deploy-eks), or "custom": this
# file runs the release check and the gate, and then only reports `deploy=custom` with the environment, commit and
# version; the repository's own workflow does the deploy (the caller's `custom` job, kskill-callers.mjs). Its cloud
# credentials and trust policy are the repository's own.
# Never runs from a pull request but as a dry run. No paths-ignore.
# Inert without a runner: where the Actions variable KSKILL_CD_STAGING (or KSKILL_CD_PROD) is "false", the run's jobs
# are skipped by their `if:` before any runner starts. kheona-skill's scripts/kskill-repo-settings.sh writes those
# variables from `.kheona.json`; unset, the settings job reads `.kheona.json` as before.
#
# Secrets: AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY (only without awsRoleArn); KSKILL_TOKEN_BROKER_URL (variable: the
# gate's repository check, the private lib submodule, and recording the digest in the release); SLACK_WEBHOOK_URL
# (optional).
#
# .kheona.json `workflows.cd` (a missing key means the default):
#   target              string   "eks"  "eks", or "custom": the repository's own workflow deploys (above)
#   templateRepository  string   ""  "owner/repo" of a template that never deploys itself: there the run is
#                                    skipped; its forks inherit the value and deploy.
#   platform            string   "linux/arm64"  the one architecture the image is built for: linux/arm64 or
#                                    linux/amd64, on that architecture's own runner: never emulated. The older key
#                                    `platforms` is read when it names one platform; a list of several fails.
#   rolloutTimeout      string   "5m"           kubectl rollout status timeout per deployment
#   environmentVariable string   ""  when set (e.g. "ENVIRONMENT"), set to "staging"/"prod" on every deployment
#   staging, prod       object | false   required: the environment's targets, or false = this repo has none
#                                         (a run that would deploy it then skips with a notice). Missing = error.
#     awsRoleArn        string   ""  the role assumed with the job's OIDC identity; empty = the stored keys
#     ecrRepository     string   required  ECR repository name
#     region            string   required  AWS region (ECR and EKS)
#     cluster           string   required  EKS cluster name
#     namespace         string   required unless `targets`  Kubernetes namespace
#     buildArgs         object   {}  Docker build arguments for this environment, {"NAME": "value"}. With them the
#                                    two environments build different images, so each needs its own ecrRepository.
#     deployments       string[] []        deployments to set (container name = deployment name)
#     cronjobs          string[] []        cron jobs to set (container name = cron job name)
#     targets           array    [{namespace, deployments, cronjobs}] from the three keys above; use it instead
#                                when one environment spans several namespaces
#     slackLabel        string   "[Staging][Api]" / "[Prod][Api]"  prefix of the Slack messages
name: Kheona Skill · CD · Build, push and deploy
run-name: ${{ startsWith(github.ref, 'refs/tags/') && format('Deploy {0} to prod', github.ref_name) || 'Deploy to staging' }}

on:
  workflow_call:
    inputs:
      gate:
        description: Run this file's gate (kskill-ci.yml) first; false (the caller ran it) is never honoured on a version tag.
        type: boolean
        default: true
      stack:
        description: Empty (the default) lets the gate read it from the repository (kskill-ci.yml); an older generation of callers still passes its own.
        type: string
        default: ''
      dry_run:
        description: Stop before anything is built, pushed or rolled out (the self-test).
        type: boolean
        default: false
    secrets:
      AWS_ACCESS_KEY_ID:
        required: false
      AWS_SECRET_ACCESS_KEY:
        required: false
      SLACK_WEBHOOK_URL:
        required: false
    outputs:
      deploy:
        description: '"custom" when the repository''s own workflow is to deploy now (workflows.cd.target "custom"); else empty.'
        value: ${{ jobs.custom.outputs.deploy }}
      environment:
        description: staging or prod.
        value: ${{ jobs.plan.outputs.environment }}
      version:
        description: The version tag a production run deploys; empty on staging.
        value: ${{ jobs.plan.outputs.version }}
      app-version:
        description: The version the service reports (APP_VERSION), on both environments.
        value: ${{ jobs.plan.outputs.app-version }}

concurrency:
  group: kskill-deploy-${{ startsWith(github.ref, 'refs/tags/') && 'prod' || 'staging' }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  KSKILL_BOT: ${{ vars.KSKILL_BOT }}
  KSKILL_LIB_REPO: ${{ vars.KSKILL_LIB_REPO }}

jobs:
  # Runs before the gate so a refused release, a missing setting or secret fails in seconds, not after the tests.
  plan:
    name: Check the release and read the deploy settings
    if: >-
      (!startsWith(github.ref, 'refs/tags/') && vars.KSKILL_CD_STAGING != 'false') ||
      (startsWith(github.ref, 'refs/tags/') && vars.KSKILL_CD_PROD != 'false')
    runs-on: ubuntu-24.04
    timeout-minutes: 50     # the release check waits up to 45 min for Main on the commit before
    permissions:
      contents: read
      pull-requests: read      # the release check: the release PR that made the tagged commit
      actions: read            # the release check: Main's run on the commit before the release
    outputs:
      deploy: ${{ steps.read.outputs.deploy }}
      target: ${{ steps.read.outputs.target }}
      environment: ${{ steps.env.outputs.environment }}
      version: ${{ steps.env.outputs.version }}
      tested: ${{ steps.env.outputs.tested }}
      app-version: ${{ steps.app-version.outputs.app-version }}
      ecr-repository: ${{ steps.read.outputs.ecr-repository }}
      region: ${{ steps.read.outputs.region }}
      cluster: ${{ steps.read.outputs.cluster }}
      targets: ${{ steps.read.outputs.targets }}
      platform: ${{ steps.read.outputs.platform }}
      runner: ${{ steps.read.outputs.runner }}
      build-args: ${{ steps.read.outputs.build-args }}
      rollout-timeout: ${{ steps.read.outputs.rollout-timeout }}
      environment-variable: ${{ steps.read.outputs.environment-variable }}
      slack-label: ${{ steps.read.outputs.slack-label }}
      aws-role-arn: ${{ steps.read.outputs.aws-role-arn }}
    steps:
      - name: Reach this version's files
        uses: $/.github/actions/kskill-home

      # The environment from the ref alone, and for production every release check (the script's header).
      - name: Check the release
        id: env
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          ACTOR: ${{ github.triggering_actor }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: bash "$KSKILL_HOME/.github/scripts/kskill-release-check.sh"

      - name: Name the version
        id: app-version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.env.outputs.version }}
        run: bash "$KSKILL_HOME/.github/scripts/kskill-app-version.sh"

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read .kheona.json
        id: read
        env:
          ENVIRONMENT: ${{ steps.env.outputs.environment }}
        run: |
          set -euo pipefail
          out() { echo "$1=$2" >> "$GITHUB_OUTPUT"; }
          skip() { echo "::notice::$1"; echo "Deploy skipped: $1" >> "$GITHUB_STEP_SUMMARY"; out deploy false; exit 0; }
          fail() { echo "::error::$1"; exit 1; }
          f=.kheona.json
          [ -f "$f" ] || fail "$f is missing: the deploy settings live under workflows.cd (see this file's header)."
          jq -e . "$f" > /dev/null || fail "$f is not valid JSON."

          [ "$(jq -r '.workflows.cd.enabled' "$f")" != false ] || skip "workflows.cd.enabled is false: this repository deploys nothing here."
          template=$(jq -r '.workflows.cd.templateRepository // empty' "$f")
          if [ "$template" = "$GITHUB_REPOSITORY" ]; then
            skip "$GITHUB_REPOSITORY is a template (workflows.cd.templateRepository): nothing deploys here."
          fi
          env="$ENVIRONMENT"
          case "$env" in staging|prod) ;; *) fail "No environment for this run (the release check decides it)." ;; esac

          target=$(jq -r '.workflows.cd.target // "eks"' "$f")
          case "$target" in eks|custom) ;; *) fail "workflows.cd.target must be \"eks\" or \"custom\" (found '$target')." ;; esac
          out target "$target"

          kind=$(jq -r --arg e "$env" '.workflows.cd[$e] | type' "$f")
          case "$kind" in
            boolean)
              [ "$(jq -r --arg e "$env" '.workflows.cd[$e]' "$f")" = false ] || fail "workflows.cd.$env must be an object or false."
              skip "workflows.cd.$env is false: this repository has no $env environment." ;;
            object) ;;
            null) fail "workflows.cd.$env is missing in $f. Set its targets, or false if this repository has no $env." ;;
            *) fail "workflows.cd.$env must be an object or false (found $kind)." ;;
          esac

          if [ "$target" = custom ]; then
            out deploy true
            echo "workflows.cd.target is custom: after the gate, the repository's own workflow deploys $env."
            exit 0
          fi

          name_re='^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$'
          get() { jq -r --arg e "$env" ".workflows.cd[\$e].$1 // empty" "$f"; }
          bad=0
          for key in ecrRepository region cluster; do
            value=$(get "$key")
            if [ -z "$value" ] || [[ "$value" =~ ^(REPO|REGION|CLUSTER|NAMESPACE|REPLACE_ME)$ ]]; then
              echo "::error::workflows.cd.$env.$key is empty or a placeholder ('$value')."; bad=1
            elif ! [[ "$value" =~ ^[a-z0-9][-a-z0-9_./]*$ ]]; then
              echo "::error::workflows.cd.$env.$key has unexpected characters ('$value')."; bad=1
            fi
          done
          targets=$(jq -c --arg e "$env" '.workflows.cd[$e] as $b
            | ($b.targets // [{namespace: $b.namespace, deployments: $b.deployments, cronjobs: $b.cronjobs}])
            | map({namespace: (.namespace // ""), deployments: (.deployments // []), cronjobs: (.cronjobs // [])})' "$f")
          if [ "$(jq 'length' <<< "$targets")" = 0 ]; then
            echo "::error::workflows.cd.$env.targets is empty."; bad=1
          fi
          while read -r ns count; do
            if ! [[ "$ns" =~ $name_re ]] || [[ "$ns" =~ ^(NAMESPACE|REPLACE_ME)$ ]]; then
              echo "::error::workflows.cd.$env: namespace '$ns' is empty, a placeholder or not a Kubernetes name."; bad=1
            fi
            if [ "$count" = 0 ]; then
              echo "::error::workflows.cd.$env: namespace '$ns' lists no deployment and no cron job."; bad=1
            fi
          done < <(jq -r '.[] | "\(.namespace) \((.deployments | length) + (.cronjobs | length))"' <<< "$targets")
          for name in $(jq -r '.[] | (.deployments + .cronjobs)[]' <<< "$targets"); do
            [[ "$name" =~ $name_re ]] || { echo "::error::workflows.cd.$env: '$name' is not a Kubernetes name."; bad=1; }
          done

          # One architecture, built natively: the runner is chosen from it below, and nothing is emulated.
          platform=$(jq -r '.workflows.cd.platform // .workflows.cd.platforms // "linux/arm64"' "$f")
          case "$platform" in
            linux/arm64) runner=ubuntu-24.04-arm ;;
            linux/amd64) runner=ubuntu-24.04 ;;
            *,*) echo "::error::workflows.cd.platform ('$platform') lists several platforms: build one, natively (no emulation). Set workflows.cd.platform to linux/arm64 or linux/amd64, the architecture of the cluster's nodes."; bad=1 ;;
            *) echo "::error::workflows.cd.platform is invalid ('$platform'): linux/arm64 or linux/amd64."; bad=1 ;;
          esac
          [ "$(jq -r '.workflows.cd.platforms // empty' "$f")" = "" ] || echo "::notice::workflows.cd.platforms is the older name: rename it to workflows.cd.platform."
          # Build arguments of this environment: names and one-line values only; different from the other
          # environment's means a different image, which must not overwrite it under the same tag.
          build_args=$(jq -c --arg e "$env" '.workflows.cd[$e].buildArgs // {}' "$f")
          if ! jq -e 'type == "object" and all(to_entries[]; (.key | test("^[A-Za-z_][A-Za-z0-9_]*$")) and (.value | type == "string") and (.value | test("\n") | not))' <<< "$build_args" > /dev/null; then
            echo "::error::workflows.cd.$env.buildArgs must be an object of NAME: \"one-line string\"."; bad=1
          fi
          other=$([ "$env" = prod ] && echo staging || echo prod)
          if [ "$(jq -r --arg o "$other" '.workflows.cd[$o] | type' "$f")" = object ] \
             && [ "$(jq -c --arg o "$other" '.workflows.cd[$o].buildArgs // {}' "$f")" != "$build_args" ] \
             && [ "$(jq -r --arg o "$other" '.workflows.cd[$o].ecrRepository // empty' "$f")" = "$(get ecrRepository)" ]; then
            echo "::error::workflows.cd.staging and .prod build different images (buildArgs) into the same ecrRepository: one would overwrite the other's tag. Give each environment its own ecrRepository."; bad=1
          fi
          timeout=$(jq -r '.workflows.cd.rolloutTimeout // "5m"' "$f")
          [[ "$timeout" =~ ^[0-9]+[smh]$ ]] || { echo "::error::workflows.cd.rolloutTimeout is invalid ('$timeout')."; bad=1; }
          envvar=$(jq -r '.workflows.cd.environmentVariable // empty' "$f")
          [ -z "$envvar" ] || [[ "$envvar" =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || { echo "::error::workflows.cd.environmentVariable is invalid ('$envvar')."; bad=1; }
          [ -z "$(get healthcheckUrl)" ] || echo "::warning::workflows.cd.$env.healthcheckUrl is retired and ignored: the deploy reads the running image back from the cluster."
          if [ "$env" = prod ]; then default_label='[Prod][Api]'; else default_label='[Staging][Api]'; fi
          label=$(get slackLabel); label="${label:-$default_label}"
          [ "$bad" = 0 ] || exit 1

          out deploy true
          out ecr-repository "$(get ecrRepository)"
          out region "$(get region)"
          out cluster "$(get cluster)"
          out targets "$targets"
          out platform "$platform"
          # Native builds : emulating arm64 on an amd64 runner took ~27 min per image.
          out runner "$runner"
          out build-args "$build_args"
          out rollout-timeout "$timeout"
          out environment-variable "$envvar"
          out slack-label "$label"
          out aws-role-arn "$(jq -r --arg e "$env" '.workflows.cd[$e].awsRoleArn // empty' "$f")"

      # names only, never a value.
      - name: Check the secrets
        if: steps.read.outputs.deploy == 'true' && steps.read.outputs.target == 'eks' && !inputs.dry_run
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          KSKILL_TOKEN_BROKER_URL: ${{ vars.KSKILL_TOKEN_BROKER_URL }}
          AWS_ROLE_ARN: ${{ steps.read.outputs.aws-role-arn }}
        run: |
          bad=0
          required=""
          [ -n "$AWS_ROLE_ARN" ] || required="AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY"
          [ -n "$KSKILL_TOKEN_BROKER_URL" ] || { echo "::error::Variable KSKILL_TOKEN_BROKER_URL is not set."; bad=1; }
          for name in $required; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret $name is not set (Settings > Secrets and variables > Actions)."
              bad=1
            fi
          done
          exit "$bad"

  # An image production may run without building, on a version tag. A rollback (a dispatch): the image that release
  # deployed, by the digest its notes record. A release (a push): the image staging built from the commit before,
  # when the release commit changes nothing but versions. Either only when ECR still holds it. Its own job: it needs
  # the AWS identity, which the plan job does not get.
  image:
    name: Find the release's image
    needs: plan
    if: >-
      startsWith(github.ref, 'refs/tags/') && !inputs.dry_run
      && needs.plan.outputs.deploy == 'true' && needs.plan.outputs.target == 'eks'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    outputs:
      digest: ${{ steps.find.outputs.digest }}
      source: ${{ steps.find.outputs.source }}
    steps:
      - name: Reach this version's files
        uses: $/.github/actions/kskill-home

      - name: Read the digest from the release
        id: notes
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.plan.outputs.version }}
        run: |
          digest=$(gh release view "$TAG" --json body --jq .body | grep -oE 'kskill-image-digest: sha256:[0-9a-f]{64}' | tail -n 1 | cut -d' ' -f2 || true)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          [ -n "$digest" ] || echo "::notice::$TAG records no image digest: the rollback builds and tests it in full."

      - name: Check the release commit changes only versions
        id: promote
        if: github.event_name != 'workflow_dispatch' && needs.plan.outputs.tested != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TESTED: ${{ needs.plan.outputs.tested }}
        run: bash "$KSKILL_HOME/.github/scripts/kskill-release-image.sh"

      - name: Configure AWS credentials
        if: steps.notes.outputs.digest != '' || steps.promote.outputs.promote == 'true'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ needs.plan.outputs.aws-role-arn }}
          aws-access-key-id: ${{ needs.plan.outputs.aws-role-arn == '' && secrets.AWS_ACCESS_KEY_ID || '' }}
          aws-secret-access-key: ${{ needs.plan.outputs.aws-role-arn == '' && secrets.AWS_SECRET_ACCESS_KEY || '' }}
          aws-region: ${{ needs.plan.outputs.region }}

      # The digest must be an image of this environment's repository: release notes can be edited by any writer.
      # Staging's image is found by its commit tag in this environment's repository (one built with other build
      # arguments lives in another repository: the plan job refuses a shared one), then deployed by digest.
      - name: Check ECR still holds it
        id: find
        if: steps.notes.outputs.digest != '' || steps.promote.outputs.promote == 'true'
        env:
          DIGEST: ${{ steps.notes.outputs.digest }}
          TESTED: ${{ needs.plan.outputs.tested }}
          REPOSITORY: ${{ needs.plan.outputs.ecr-repository }}
        run: |
          if [ -n "$DIGEST" ]; then
            if aws ecr describe-images --repository-name "$REPOSITORY" --image-ids "imageDigest=$DIGEST" > /dev/null 2>&1; then
              { echo "digest=$DIGEST"; echo "source=rollback"; } >> "$GITHUB_OUTPUT"
              echo "Rollback to the release's own image ($DIGEST): no gate, no build." >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::notice::ECR no longer holds $DIGEST: the rollback builds and tests it in full."
            fi
            exit 0
          fi
          found=$(aws ecr describe-images --repository-name "$REPOSITORY" --image-ids "imageTag=$TESTED" --query 'imageDetails[0].imageDigest' --output text 2>/dev/null || true)
          if [[ "$found" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            { echo "digest=$found"; echo "source=promote"; } >> "$GITHUB_OUTPUT"
            echo "Production runs the image staging tested (${TESTED:0:7}, $found): no gate, no build." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::notice::$REPOSITORY holds no image of ${TESTED:0:7}: production builds and tests the release in full."
          fi

  # Nothing deploys from a commit that has not passed the gate: this one, or off a tag the caller's (`gate: false`,
  # kskill-main.yml, whose deploy job `needs:` its own gate). A tag runs it in full, unless it deploys an image ECR
  # holds: a rollback's (it passed when released) or staging's (Main passed on that commit: the release check).
  # toJSON, not `!= false`: GitHub compares loosely, and a missing input (null) equals false.
  ci:
    name: Run the gate
    needs: [plan, image]
    if: >-
      !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.deploy == 'true'
      && needs.image.result != 'failure' && needs.image.outputs.digest == ''
      && (toJSON(inputs.gate) != 'false' || startsWith(github.ref, 'refs/tags/'))
    uses: ./.github/workflows/kskill-ci.yml
    # The deploy job builds the image itself, before any rollout: the gate does not build it twice.
    with:
      stack: ${{ inputs.stack }}
      image: false
    permissions:
      contents: read
      actions: read            # the gate reuses a green PR run of the same tree on main (kskill-tested-tree.sh)
      id-token: write

  deploy:
    name: Deploy to ${{ needs.plan.outputs.environment }}
    needs: [plan, image, ci]
    if: >-
      !cancelled() && github.event_name != 'pull_request' && needs.plan.result == 'success'
      && needs.plan.outputs.deploy == 'true' && needs.plan.outputs.target == 'eks' && needs.image.result != 'failure'
      && (needs.ci.result == 'success' || (needs.ci.result == 'skipped'
        && ((toJSON(inputs.gate) == 'false' && !startsWith(github.ref, 'refs/tags/')) || needs.image.outputs.digest != '')))
    permissions:
      contents: read
      id-token: write
    runs-on: ${{ needs.plan.outputs.runner }}
    timeout-minutes: 45
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      SLACK_LABEL: ${{ needs.plan.outputs.slack-label }}
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - name: Reach this version's files
        uses: $/.github/actions/kskill-home

      - name: Announce the start on Slack
        if: env.SLACK_WEBHOOK_URL != '' && !inputs.dry_run
        continue-on-error: true
        run: |
          jq -n --arg t "$SLACK_LABEL Starts deploying ${VERSION:-${GITHUB_SHA:0:7}} (${GITHUB_REPOSITORY})..." '{text: $t}' \
            | curl -fsS --max-time 10 -H 'Content-Type: application/json' -d @- "$SLACK_WEBHOOK_URL"

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Read-only, the library repository (a private submodule). Not for a rollback to an existing image: nothing is built.
      - name: Mint the library token
        id: shared
        if: hashFiles('.gitmodules') != '' && needs.image.outputs.digest == ''
        uses: $/.github/actions/kskill-token
        with:
          broker-url: ${{ vars.KSKILL_TOKEN_BROKER_URL }}
          shared: 'true'
          permissions: '{"contents": "read"}'

      # Over HTTPS with the read-only token, given to git for that command only: .gitmodules is never modified and the
      # token is not left in the working tree.
      - name: Check out the submodules
        if: hashFiles('.gitmodules') != '' && needs.image.outputs.digest == ''
        env:
          SUBMODULE_TOKEN: ${{ steps.shared.outputs.token }}
        run: bash "$KSKILL_HOME/.github/scripts/kskill-checkout-submodules.sh"

      - name: Stop here on a dry run
        if: inputs.dry_run
        run: echo "Dry run, nothing built or pushed. Target $ENVIRONMENT."
        env:
          ENVIRONMENT: ${{ needs.plan.outputs.environment }}

      - name: Build and deploy
        id: eks
        if: ${{ !inputs.dry_run }}
        uses: $/.github/actions/kskill-deploy-eks
        with:
          role-arn: ${{ needs.plan.outputs.aws-role-arn }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          region: ${{ needs.plan.outputs.region }}
          cluster: ${{ needs.plan.outputs.cluster }}
          ecr-repository: ${{ needs.plan.outputs.ecr-repository }}
          targets: ${{ needs.plan.outputs.targets }}
          platform: ${{ needs.plan.outputs.platform }}
          build-args: ${{ needs.plan.outputs.build-args }}
          environment-name: ${{ needs.plan.outputs.environment }}
          environment-variable: ${{ needs.plan.outputs.environment-variable }}
          rollout-timeout: ${{ needs.plan.outputs.rollout-timeout }}
          image-digest: ${{ needs.image.outputs.digest }}
          version: ${{ needs.plan.outputs.version }}
          app-version: ${{ needs.plan.outputs.app-version }}

      # The App token, contents write on this repository only: the job's own token only reads.
      - name: Mint the App token
        id: app
        if: ${{ !inputs.dry_run && needs.plan.outputs.version != '' && needs.image.outputs.source != 'rollback' }}
        uses: $/.github/actions/kskill-token
        with:
          broker-url: ${{ vars.KSKILL_TOKEN_BROKER_URL }}
          permissions: '{"contents": "write"}'

      # What a rollback deploys again: the digest, in the release's notes (the title and notes of an immutable release
      # stay editable; its tag and assets do not).
      - name: Record the image in the release
        if: steps.app.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          GH_REPO: ${{ github.repository }}
          DIGEST: ${{ steps.eks.outputs.digest }}
        run: |
          body=$(gh release view "$VERSION" --json body --jq .body)
          printf '%s\n\n<!-- kskill-image-digest: %s -->\n' "$body" "$DIGEST" > "$RUNNER_TEMP/notes.md"
          gh release edit "$VERSION" --notes-file "$RUNNER_TEMP/notes.md" > /dev/null
          echo "Recorded $DIGEST in release $VERSION." >> "$GITHUB_STEP_SUMMARY"

      - name: Announce the result on Slack
        if: always() && env.SLACK_WEBHOOK_URL != '' && !inputs.dry_run
        continue-on-error: true
        env:
          STATUS: ${{ job.status }}
        run: |
          what="${VERSION:-${GITHUB_SHA:0:7}}"
          if [ "$STATUS" = success ]; then text="$SLACK_LABEL Published $what !"; else text="$SLACK_LABEL Deploy of $what ended: $STATUS"; fi
          text="$text ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          jq -n --arg t "$text" '{text: $t}' \
            | curl -fsS --max-time 10 -H 'Content-Type: application/json' -d @- "$SLACK_WEBHOOK_URL"

  # workflows.cd.target "custom": the release is checked and the gate passed; the repository's own workflow deploys
  # (the caller's `custom` job reads this job's output).
  custom:
    name: Hand over to the repository's own deploy
    needs: [plan, ci]
    if: >-
      !cancelled() && github.event_name != 'pull_request' && !inputs.dry_run && needs.plan.result == 'success'
      && needs.plan.outputs.deploy == 'true' && needs.plan.outputs.target == 'custom'
      && (needs.ci.result == 'success' || (needs.ci.result == 'skipped' && toJSON(inputs.gate) == 'false' && !startsWith(github.ref, 'refs/tags/')))
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      deploy: ${{ steps.go.outputs.deploy }}
    steps:
      - name: Hand over
        id: go
        env:
          ENVIRONMENT: ${{ needs.plan.outputs.environment }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          echo "deploy=custom" >> "$GITHUB_OUTPUT"
          echo "Checked and tested: the repository's own workflow deploys ${VERSION:-${GITHUB_SHA:0:7}} to $ENVIRONMENT." >> "$GITHUB_STEP_SUMMARY"
