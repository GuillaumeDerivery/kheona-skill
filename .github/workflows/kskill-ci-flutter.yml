# not distributed with this file, You can obtain one at https://mozilla.org/MPL/2.0/.
# Trigger: called by Kheona Skill · PR, Main and the delivery; by hand
# Purpose: the Flutter gate: format, analyze, tests, repository checks, OSV scan of changed lockfiles
# Effect: nothing: reports only
# Run by the shared kskill-ci.yml wherever the stack it reads is flutter (the delivery calls kskill-ci.yml).
# the gate of a Flutter app. Called, never triggered by a push of its own: by `Kheona Skill · PR` on every pull
# request (kskill-pr.yml, any base: a `branches:` filter gives a stacked PR zero checks), by `Kheona Skill · Main` on
# every push to main (kskill-main.yml) and as the first job of the delivery (workflow_call), so nothing ships from an
# unverified commit; on demand too. Never publishes anything: it is
# reachable from a feature branch. The repository check is its first step after the checkout.
# Once per tree (kskill-tested-tree.sh): a push to the default branch whose tree a green `Kheona Skill · PR` run tested
# skips every step after its first ones; a version tag (the delivery's gate) and dispatches always run in full.
# Order : install from the lockfile, Android toolchain, format, analyze, repository
# checks, local packages, tests, then the OSV scan of the lockfiles (a warning, never a failure here; on a PR
# only when it changes a pubspec.lock or an osv-scanner.toml).
# Coverage is collected and uploaded, never gated : no lcov, no percentage, no floor. The Flutter version is read from .fvmrc / pubspec.yaml (kskill-flutter-version.sh).
# iOS Swift packages: Verify fails when ios/ tracks more than one Package.resolved and they differ (Xcode reads the
# workspace's; a stale copy crashes its package resolution). On a pull request that changes pubspec.yaml,
# pubspec.lock or anything under ios/, `iOS packages` (macOS, the delivery's Xcode) runs the resolution the iOS
# delivery runs and fails if Xcode fails or rewrites a committed Package.resolved: the Linux gate builds no iOS, so a
# dependency bump could otherwise pass every check and break only the TestFlight lane.
#
# .kheona.json `workflows.ci` (all optional):
#   androidToolchain  boolean   default: true when android/ exists. Runs kskill-check-flutter-toolchain.sh.
#   formatPaths       string[]  default: ["lib", "test"]. Directories `dart format` checks; each package path is
#                               added. A listed directory that does not exist is skipped.
#   checks            string[]  default: []. Repository commands run after analyze, each must exit 0
#                               (e.g. "./tool/check_invariants.sh"). They come from the repository, like its code.
#   testConcurrency   integer   default: the runner's CPU count. `flutter test --concurrency`: package:test would
#                               otherwise run half as many test files at once (one, on a 2-CPU runner).
#   iosPackages       boolean   default: true when ios/ exists. Runs the `iOS packages` job (above).
#   packages          array     default: []. Local packages verified on their own (kskill-flutter-package.sh):
#                               "packages/x" or {"path": "packages/x", "failUnder": 90}. failUnder is the
#                               pure-Dart threshold, ignored on a Flutter package.
# .kheona.json `phase` (kskill-phase.sh): "bootstrap" passes an app with no test/ directory yet and reports the
# packages' failUnder without failing on it; "established" (the default) requires both. A run on a version tag
# (the delivery's gate) fails while the repository is in bootstrap.
# Variable: KSKILL_TOKEN_BROKER_URL (the token broker; required by the repository check).
name: Kheona Skill · CI

on:
  workflow_call:
    inputs:
      image:
        description: Ignored (a Flutter app builds no Docker image); every kskill-ci.yml takes the same inputs.
        type: boolean
        default: true
      called:
        type: boolean
        default: false
      stack:
        description: The stack, for the job names.
        type: string
        default: ''

concurrency:
  group: kskill-ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# actions: read: the reuse lookup (kskill-tested-tree.sh). A caller grants it to its `uses:` job.
permissions:
  contents: read
  actions: read

# Explicit bash runs with -o pipefail; the implicit default (`bash -e`) lets a failing command before a pipe pass.
defaults:
  run:
    shell: bash

env:
  KSKILL_BOT: ${{ vars.KSKILL_BOT }}
  KSKILL_LIB_REPO: ${{ vars.KSKILL_LIB_REPO }}

jobs:
  verify:
    name: Verify
    permissions:
      contents: read
      actions: read
      id-token: write
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Reach this version's files
        uses: $/.github/actions/kskill-home

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # once per tree: a pull_request run records the tree it tests; a push to the default branch whose tree a
      # green Kheona Skill · PR run already tested skips the rest of this gate (kskill-tested-tree.sh says exactly when;
      # never on a tag, never when unsure).
      - name: Record the tested tree
        id: tree
        if: github.event_name == 'pull_request'
        run: bash "$KSKILL_HOME/.github/scripts/kskill-tested-tree.sh" record

      - name: Upload the tested tree
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kskill-tested-tree-${{ steps.tree.outputs.tree }}
          path: ${{ steps.tree.outputs.file }}
          retention-days: 14
          overwrite: true

      - name: Look for a green PR run of this tree
        id: reuse
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: bash "$KSKILL_HOME/.github/scripts/kskill-tested-tree.sh" find

      # every caller as this version expects it, every other workflow declared.
      - name: Check the repository
        if: steps.reuse.outputs.reused != 'true'
        uses: $/.github/actions/kskill-repo-check
        with:
          broker-url: ${{ vars.KSKILL_TOKEN_BROKER_URL }}
          fork: ${{ github.event.repository.fork }}
          sentry-project: ${{ vars.SENTRY_PROJECT }}

      # Xcode resolves through the workspace's Package.resolved; Xcode also writes one under the project when the
      # project is opened alone. Two tracked copies drift apart (one updated by hand, the other not) and a stale
      # workspace copy crashes `xcodebuild -resolvePackageDependencies` ("Unable to load workspace"). Keep one; if
      # several are tracked they must be identical.
      - name: Check the Swift package pins
        if: steps.reuse.outputs.reused != 'true'
        run: |
          pins=$(git ls-files -- 'ios/*Package.resolved' 'macos/*Package.resolved')
          for dir in ios macos; do
            files=$(grep "^$dir/" <<<"$pins" || true)
            n=$(grep -c . <<<"$files" || true)
            [ "$n" -gt 1 ] || continue
            first=$(head -n 1 <<<"$files")
            while IFS= read -r f; do
              if ! cmp -s "$first" "$f"; then
                echo "::error file=$f::$f differs from $first. Xcode resolves through the workspace's Package.resolved: keep that one, untrack and gitignore the other (Runner.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved)."
                exit 1
              fi
            done <<<"$files"
            echo "::notice::$dir/ tracks $n identical Package.resolved files: keep only the workspace's so they cannot drift apart."
          done
          echo "Swift package pin files: $(grep -c . <<<"$pins" || true), none diverging."

      # bootstrap or established; a store release (the delivery's gate on a version tag) refuses bootstrap.
      - name: Read the phase
        id: phase
        if: steps.reuse.outputs.reused != 'true'
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then bash "$KSKILL_HOME/.github/scripts/kskill-phase.sh" --ship; else bash "$KSKILL_HOME/.github/scripts/kskill-phase.sh"; fi

      - name: Read the configuration
        id: config
        if: steps.reuse.outputs.reused != 'true'
        run: |
          cfg='{}'
          if [ -f .kheona.json ]; then
            if ! cfg=$(jq -c . .kheona.json); then
              echo "::error file=.kheona.json::not valid JSON"
              exit 1
            fi
          fi
          ci() { jq -c "(.workflows.ci // {}) | $1" <<<"$cfg"; }

          android=$(ci '.androidToolchain // null')
          if [ "$android" = null ]; then
            if [ -d android ]; then android=true; else android=false; fi
          fi

          jobs=$(ci '.testConcurrency // null')
          [ "$jobs" != null ] || jobs=$(nproc)
          [[ "$jobs" =~ ^[1-9][0-9]*$ ]] || { echo "::error file=.kheona.json::workflows.ci.testConcurrency must be a positive integer (got $jobs)."; exit 1; }

          packages=$(ci '[(.packages // [])[] | if type == "string" then {path: .} else . end]')
          checks=$(ci '.checks // []')
          paths=$(ci '(.formatPaths // ["lib", "test"])[]' | jq -r .)
          paths="$paths $(jq -r '.[].path' <<<"$packages")"
          format_paths=""
          for p in $paths; do [ -e "$p" ] && format_paths="$format_paths $p"; done

          {
            echo "android_toolchain=$android"
            echo "packages=$packages"
            echo "checks=$checks"
            echo "format_paths=${format_paths# }"
            echo "test_concurrency=$jobs"
          } >> "$GITHUB_OUTPUT"
          echo "androidToolchain=$android packages=$packages checks=$checks testConcurrency=$jobs format:${format_paths}"

      - name: Read the Flutter version
        id: flutter
        if: steps.reuse.outputs.reused != 'true'
        run: bash "$KSKILL_HOME/.github/scripts/kskill-flutter-version.sh" | tee -a "$GITHUB_OUTPUT"

      - name: Set up Flutter
        if: steps.reuse.outputs.reused != 'true'
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ steps.flutter.outputs.version }}
          channel: ${{ steps.flutter.outputs.channel }}
          cache: true

      - name: Confirm the Flutter version
        if: steps.reuse.outputs.reused != 'true'
        env:
          WANT: ${{ steps.flutter.outputs.version }}
        run: |
          have=$(flutter --version --machine | jq -r .frameworkVersion)
          if [ "$have" != "$WANT" ]; then
            echo "::error::Flutter $have installed, $WANT pinned."
            exit 1
          fi
          echo "Flutter $have"

      # --enforce-lockfile: a bare `pub get` can resolve a transitive bump pubspec.lock does not pin.
      - name: Install dependencies
        if: steps.reuse.outputs.reused != 'true'
        run: flutter pub get --enforce-lockfile

      - name: Check the Android toolchain
        if: steps.reuse.outputs.reused != 'true' && steps.config.outputs.android_toolchain == 'true'
        run: bash "$KSKILL_HOME/.github/scripts/kskill-check-flutter-toolchain.sh"

      - name: Check formatting
        if: steps.reuse.outputs.reused != 'true'
        env:
          FORMAT_PATHS: ${{ steps.config.outputs.format_paths }}
        run: |
          if [ -z "$FORMAT_PATHS" ]; then
            echo "::error::None of workflows.ci.formatPaths exists: nothing would be format-checked."
            exit 1
          fi
          # shellcheck disable=SC2086 # why: a space-separated list of directories, split on purpose
          dart format --output=none --set-exit-if-changed $FORMAT_PATHS

      - name: Analyze
        if: steps.reuse.outputs.reused != 'true'
        run: flutter analyze

      - name: Run the repository checks
        if: steps.reuse.outputs.reused != 'true' && steps.config.outputs.checks != '[]'
        env:
          CHECKS: ${{ steps.config.outputs.checks }}
        run: |
          status=0
          while IFS= read -r cmd; do
            echo "::group::$cmd"
            bash -c "$cmd" || { echo "::error::Repository check failed: $cmd"; status=1; }
            echo "::endgroup::"
          done < <(jq -r '.[]' <<<"$CHECKS")
          exit "$status"

      - name: Verify the local packages
        if: steps.reuse.outputs.reused != 'true' && steps.config.outputs.packages != '[]'
        env:
          PACKAGES: ${{ steps.config.outputs.packages }}
          PHASE: ${{ steps.phase.outputs.phase }}
        run: |
          status=0
          while IFS=$'\t' read -r path fail_under; do
            # Bootstrap: the threshold is reported, not enforced.
            if [ "$PHASE" = bootstrap ] && [ -n "$fail_under" ]; then
              echo "::notice::$path: failUnder $fail_under not enforced in the bootstrap phase."; fail_under=""
            fi
            bash "$KSKILL_HOME/.github/scripts/kskill-flutter-package.sh" "$path" "$fail_under" || status=1
          done < <(jq -r '.[] | [.path, (.failUnder // "" | tostring)] | @tsv' <<<"$PACKAGES")
          exit "$status"

      # --coverage writes coverage/lcov.info for the artifact below and for nothing else: the total omits
      # every file no test imports, so only the per-file records are meaningful. Never parse it here.
      - name: Run the tests
        if: steps.reuse.outputs.reused != 'true'
        env:
          PHASE: ${{ steps.phase.outputs.phase }}
          JOBS: ${{ steps.config.outputs.test_concurrency }}
        run: |
          if [ ! -d test ] && [ "$PHASE" = bootstrap ]; then
            echo "::notice::No test/ directory yet: accepted in the bootstrap phase."; exit 0
          fi
          flutter test --coverage --concurrency="$JOBS"

      # On a PR the scan runs only when the PR changes a pubspec.lock or an osv-scanner.toml: an advisory against
      # unchanged lockfiles is the weekly `security-scan` job's news, not this PR's. The PR's files come from the
      # compare API (base...head, as the PR shows them); 300 files or more, or an API error: scanned anyway.
      - name: Did the PR change a lockfile?
        id: lockfiles
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          # shellcheck disable=SC2016 # why: the single-quoted string is a jq program; $n is a jq variable
          if files=$(gh api "repos/$GH_REPO/compare/$BASE...$HEAD" --jq '.files | length as $n | if $n >= 300 then "MANY" else .[].filename end'); then
            if grep -qx MANY <<<"$files" || grep -qE '(^|/)(pubspec\.lock|osv-scanner\.toml)$' <<<"$files"; then changed=true; else changed=false; fi
          else
            echo "::warning::Could not list the PR's files: scanning anyway."; changed=true
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          [ "$changed" = true ] || echo "No pubspec.lock or osv-scanner.toml changed: no OSV scan on this PR (the weekly security scan covers it)."

      # OSV scan of the committed pub lockfiles (pub has no audit command; OSV carries pub advisories). News, not
      # a gate: an advisory published overnight is no reason to block an unrelated pull request, so a finding is a
      # warning here (the step shows failed, the job passes); the weekly `security-scan` job of Kheona Skill · Inbox
      # fails on it. A finding that cannot be fixed at once gets an [[IgnoredVulns]] entry with a reason and an
      # ignoreUntil date in osv-scanner.toml beside the lockfile. Lockfiles: workflows.security.lockfiles, default
      # "pubspec.lock" plus "<path>/pubspec.lock" for every workflows.ci.packages entry.
      - name: Scan the lockfiles for known vulnerabilities
        if: ${{ !cancelled() && steps.reuse.outputs.reused != 'true' && (github.event_name != 'pull_request' || steps.lockfiles.outputs.changed == 'true') }}
        continue-on-error: true
        env:
          OSV_SCANNER_VERSION: v2.6.0
          OSV_SCANNER_SHA256: ca69b3d3cd08f889a49dc0a383122f71cc528b83803671df5fd874d97485b108 # osv-scanner_linux_amd64
        run: |
          set -o pipefail
          cfg='{}'; [ ! -f .kheona.json ] || cfg=$(jq -c . .kheona.json)
          args=""
          for f in $(jq -r '.workflows.security.lockfiles // (["pubspec.lock"] + [(.workflows.ci.packages // [])[] | (if type == "string" then . else .path end) + "/pubspec.lock"]) | .[]' <<<"$cfg"); do
            [ -f "$f" ] || { echo "::warning::$f not found (workflows.security.lockfiles / workflows.ci.packages)."; continue; }
            args="$args --lockfile=$f"
          done
          [ -n "$args" ] || { echo "No lockfile to scan."; exit 0; }
          curl -sSfL --retry 5 --retry-delay 5 --retry-all-errors -o "$RUNNER_TEMP/osv-scanner" \
            "https://github.com/google/osv-scanner/releases/download/${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SCANNER_SHA256}  $RUNNER_TEMP/osv-scanner" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/osv-scanner"
          # shellcheck disable=SC2086 # why: one --lockfile=<path> per lockfile, split on purpose
          if ! "$RUNNER_TEMP/osv-scanner" scan source $args --format table | tee "$RUNNER_TEMP/osv.txt"; then
            echo "::warning::OSV-Scanner reports known vulnerabilities in the lockfiles: see this step's log (not a gate on this PR; the weekly security scan fails on it)."
            { echo "### OSV scan"; echo; echo '```'; head -100 "$RUNNER_TEMP/osv.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Upload the coverage report
        if: always() && steps.reuse.outputs.reused != 'true' # a failing suite is when the report matters most
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-lcov
          path: |
            coverage/lcov.info
            **/coverage/lcov.info
            !**/.dart_tool/**
            !**/build/**
          # warn: a suite that fails to compile writes no lcov.info; a second red step would hide the cause.
          if-no-files-found: warn
          retention-days: 14

  # Decides, on Linux, whether the macOS job below runs: only on a pull request that changes pubspec.yaml,
  # pubspec.lock or ios/ (macOS bills at 10x; a tag is covered by the delivery's own iOS lane).
  ios-plan:
    name: iOS packages · plan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      run: ${{ steps.plan.outputs.run }}
      xcode: ${{ steps.plan.outputs.xcode }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Decide
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          cfg='{}'
          if [ -f .kheona.json ]; then
            cfg=$(jq -c . .kheona.json) || { echo "::error file=.kheona.json::not valid JSON"; exit 1; }
          fi
          enabled=$(jq -r '.workflows.ci.iosPackages // null' <<<"$cfg")
          if [ "$enabled" = null ]; then
            if [ -d ios ]; then enabled=true; else enabled=false; fi
          fi
          xcode=$(jq -r '.workflows.cd.ios.xcode // ""' <<<"$cfg")
          [[ -z "$xcode" || "$xcode" =~ ^[0-9]+(\.[0-9]+)*$ ]] || { echo "::error file=.kheona.json::workflows.cd.ios.xcode must be a version, got '$xcode'."; exit 1; }
          run=false
          if [ "$enabled" != true ]; then
            echo "iOS packages: off (no ios/ or workflows.ci.iosPackages is false)."
          elif [ "$EVENT_NAME" != pull_request ]; then
            echo "iOS packages: pull requests only (the delivery resolves on a tag)."
          else
            # shellcheck disable=SC2016 # why: the single-quoted string is a jq program; $n is a jq variable
            if files=$(gh api "repos/$GH_REPO/compare/$BASE...$HEAD" --jq '.files | length as $n | if $n >= 300 then "MANY" else .[].filename end'); then
              if grep -qx MANY <<<"$files" || grep -qE '^(pubspec\.(yaml|lock)|ios/.*)$' <<<"$files"; then run=true; fi
            else
              echo "::warning::Could not list the PR's files: resolving anyway."; run=true
            fi
            [ "$run" = true ] || echo "iOS packages: this PR changes no pubspec.yaml, pubspec.lock or ios/ file."
          fi
          { echo "run=$run"; echo "xcode=$xcode"; } >> "$GITHUB_OUTPUT"

  # The resolution the iOS delivery's fastlane runs first (`xcodebuild -resolvePackageDependencies` on the
  # workspace), with the same Xcode. Fails if Xcode fails, or if it has to rewrite a committed Package.resolved
  # (the pins no longer match the dependencies: commit what it wrote).
  ios-packages:
    name: iOS packages
    needs: ios-plan
    if: needs.ios-plan.outputs.run == 'true'
    runs-on: macos-26
    # macOS bills at 10x; a cold resolution takes a few minutes.
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Reach this version's files
        uses: $/.github/actions/kskill-home

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode
        env:
          XCODE_VERSION: ${{ needs.ios-plan.outputs.xcode }}
        run: |
          if [ -n "$XCODE_VERSION" ]; then
            XCODE_APP="/Applications/Xcode_${XCODE_VERSION}.app"
            if [ ! -d "$XCODE_APP" ]; then
              echo "::error::$XCODE_APP is not on this runner image. Available:"
              ls -d /Applications/Xcode_*.app 2>/dev/null || true
              exit 1
            fi
            sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          else
            echo "::notice::workflows.cd.ios.xcode is not set: resolving with the image's default Xcode."
          fi
          xcodebuild -version

      - name: Read the Flutter version
        id: flutter
        run: bash "$KSKILL_HOME/.github/scripts/kskill-flutter-version.sh" | tee -a "$GITHUB_OUTPUT"

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ steps.flutter.outputs.version }}
          channel: ${{ steps.flutter.outputs.channel }}
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      # Generates the Swift package Flutter adds for the plugins (ios/Flutter/ephemeral), as `flutter build` does.
      - name: Generate the iOS project files
        run: flutter build ios --config-only --release --no-codesign

      - name: Resolve the Swift packages
        working-directory: ios
        run: |
          set -o pipefail
          if ! xcodebuild -resolvePackageDependencies -workspace Runner.xcworkspace -scheme Runner -configuration Release 2>&1 | tee "$RUNNER_TEMP/resolve.log"; then
            echo "::error::xcodebuild could not resolve the iOS Swift packages: the iOS delivery would fail the same way. A stale ios/Runner.xcworkspace/xcshareddata/swiftpm/Package.resolved is the usual cause: see this step's log."
            exit 1
          fi
          if grep -q "INTERNAL ERROR" "$RUNNER_TEMP/resolve.log"; then
            echo "::error::xcodebuild reported an internal error resolving the iOS Swift packages: see this step's log."
            exit 1
          fi

      - name: Check the committed pins
        run: |
          if ! git diff --exit-code --stat -- '*Package.resolved'; then
            git diff -- '*Package.resolved'
            echo "::error::Xcode rewrote a committed Package.resolved: the pins no longer match the dependencies. Run the same resolution locally and commit the result (see the diff above)."
            exit 1
          fi
          echo "The committed Swift package pins match the dependencies."

