# Trigger: called by the private runner repository, for open PRs here, a fork's included
# Purpose: the guard where a fork's PR has no secret: it reads the PR, never runs it, and sets a generic status
# Effect: the commit status `rule-0` on each fork PR's head, which `main` requires (the public guard sets it on its own
# PRs). The token is the automation App's, minted through the broker: the caller repository must be in its acrossOwners.
name: Kheona Skill · Guard re-check

on:
  workflow_call:
    inputs:
      repository:
        description: owner/name of the public repository.
        type: string
        required: true
    secrets:
      KSKILL_GUARD_TERMS:
        required: true

permissions:
  contents: read

jobs:
  recheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write          # the broker's token (statuses on the public repository)
    steps:
      - name: Reach this version's files
        uses: $/.github/actions/kskill-home
      - name: Mint the token
        env:
          KSKILL_TOKEN_BROKER_URL: ${{ vars.KSKILL_TOKEN_BROKER_URL }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ inputs.repository }}
        run: |
          node "$KSKILL_HOME/.github/scripts/kskill-app-tokens.mjs" "$RUNNER_TEMP/kskill-app" > /dev/null
          token=$(jq -r --arg o "$(printf '%s' "${REPO%%/*}" | tr '[:upper:]' '[:lower:]')" '.[$o] // empty' "$RUNNER_TEMP/kskill-app/tokens.json")
          rm -rf "$RUNNER_TEMP/kskill-app"
          [ -n "$token" ] || { echo "::error::No App token for ${REPO%%/*}."; exit 1; }
          echo "::add-mask::$token"
          echo "STATUS_TOKEN=$token" >> "$GITHUB_ENV"
      - name: Check every open fork PR
        env:
          GH_TOKEN: ${{ env.STATUS_TOKEN }}
          KSKILL_GUARD_TERMS: ${{ secrets.KSKILL_GUARD_TERMS }}
          REPO: ${{ inputs.repository }}
        run: |
          git clone -q --filter=blob:none "https://github.com/$REPO.git" "$RUNNER_TEMP/r"
          gh pr list -R "$REPO" --state open --limit 200 --json number,headRefOid,baseRefOid,title,body,isCrossRepository \
            --jq '[.[] | select(.isCrossRepository)]' > "$RUNNER_TEMP/prs.json"
          while read -r pr; do
            n=$(jq -r .number <<<"$pr"); head=$(jq -r .headRefOid <<<"$pr"); base=$(jq -r .baseRefOid <<<"$pr")
            git -C "$RUNNER_TEMP/r" fetch -q origin "pull/$n/head"
            git -C "$RUNNER_TEMP/r" checkout -q --detach "$head"
            jq -r '.title, .body' <<<"$pr" > "$RUNNER_TEMP/text"
            state=success
            node "$KSKILL_HOME/.github/scripts/kskill-guard.mjs" --repo "$RUNNER_TEMP/r" --self "$REPO" --commits "$base..$head" --text-file "$RUNNER_TEMP/text" > /dev/null || state=failure
            gh api "repos/$REPO/statuses/$head" -f state="$state" -f context=rule-0 -f description="Forbidden names" > /dev/null
          done < <(jq -c '.[]' "$RUNNER_TEMP/prs.json")
