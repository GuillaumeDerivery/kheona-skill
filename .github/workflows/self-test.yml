# Trigger: every pull request and push to main
# Purpose: run the shared deploy and delivery from callers inside this repository, so their paths are tested before each release
# Effect: none: dry_run stops before anything is built, pushed, rolled out, signed or uploaded
name: Self-test

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  deploy-dry-run:
    permissions:
      contents: read
      actions: read
      id-token: write
      pull-requests: read
    uses: ./.github/workflows/kskill-deploy.yml
    with:
      stack: node
      gate: false
      dry_run: true

  deliver-dry-run:
    permissions:
      contents: read
      actions: read
      id-token: write
      pull-requests: read
    uses: ./.github/workflows/kskill-deliver-flutter.yml
    with:
      stack: flutter
      dry_run: true
