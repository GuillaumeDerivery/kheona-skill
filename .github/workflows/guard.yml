# Trigger: pull requests and pushes of this repository
# Purpose: Rule 0: fail on any forbidden name, in files, commits, and the PR's title and body
# Effect: none. A fork's PR gets no secret: `kskill-guard.yml`, from the private runner repository, re-checks it.
name: Guard

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  guard:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check
        env:
          KSKILL_GUARD_TERMS: ${{ secrets.KSKILL_GUARD_TERMS }}
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          printf '%s\n%s\n' "$TITLE" "$BODY" > "$RUNNER_TEMP/pr.txt"
          node .github/scripts/kskill-guard.mjs --self "$GITHUB_REPOSITORY" --commits "${BASE:+$BASE..}HEAD" --text-file "$RUNNER_TEMP/pr.txt"
