# Trigger: a push to main (a merged PR)
# Purpose: the Flutter gate once (a green PR run of the same tree reused)
# Effect: none: an app has no staging deploy
# Everything a push to `main` starts in a Flutter app, in one run. Installed as `.github/workflows/kskill-main.yml` (the
# stack-neutral path, like kskill-ci.yml): CI, `.github/workflows/kskill-ci.yml` (the Flutter gate), called once; a green
# `Kheona Skill · PR` run of the same tree is reused (kskill-tested-tree.sh). A passed run is what a release checks on
# the commit before it. The release PR is release-please's (kskill-release-please.yml); the store delivery is the version
# tag merging it creates (kskill-deliver.yml), or a test build started by hand on main.
# Variable: KSKILL_TOKEN_BROKER_URL (the token broker). No .kheona.json keys of its own.
name: Kheona Skill · Main

on:
  workflow_call:
    inputs:
      stack:
        description: node, python, flutter or infra (written by the setup command).
        type: string
        required: true

permissions:
  contents: read

env:
  KSKILL_BOT: ${{ vars.KSKILL_BOT }}
  KSKILL_LIB_REPO: ${{ vars.KSKILL_LIB_REPO }}

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/kskill-ci.yml
    permissions:
      contents: read
      actions: read            # the tested-tree lookup: a green PR run of this tree is reused (kskill-tested-tree.sh)
      id-token: write
    with:
      stack: ${{ inputs.stack }}

