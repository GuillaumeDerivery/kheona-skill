# preparing the release: keeps one draft PR `kskill/release` -> `prod` whose head is exactly what would ship,
# titled with it; the body lists the commits since prod (grouped, PR numbers), the deploy targets from .kheona.json
# and what deserves a look (migrations, configuration keys, environment variables, native settings, pipeline,
# submodule, lockfiles). Nothing to release: the PR is closed. The git side is .github/scripts/kskill-release.sh
# prepare. Used by the release-pr jobs of kskill-main.yml (a push to main), kskill-ship.yml (a push to prod) and
# kskill-inbox.yml (the Kheona doctor's daily dispatch), each of which, before it, mints the App's token and checks
# out `main` (fetch-depth 0) with it: the script and the settings are main's, and a push to prod may predate them.
# Does nothing where .kheona.json (read from main) has role library, role template (outside a fork),
# workflows.cd.enabled false, workflows.cd.prod false, workflows.cd.templateRepository = this repository, or
# workflows.release.enabled false, or where there is no prod branch yet. It never ships: shipping is the `ship` label
# (actions/kskill-ship).
# .kheona.json `workflows.release` (a missing key means the default):
#   enabled  boolean  true   false: nothing is prepared
#   squash   boolean  false  true: prod has no recent merge base with main; each release is one commit on prod
#                            holding main's tree (build number = prod's commit count + 1 + workflows.cd.buildNumber.offset)
name: Kheona Skill · Prepare the release PR
description: Open, update or close the draft release PR kskill/release -> prod.

inputs:
  token:
    description: the App's token for this repository (a push and a PR made with it start workflows). Empty, the action fails where there is something to release.
    required: false
    default: ''
  github-token:
    description: github.token, for the reads.
    required: true

runs:
  using: composite
  steps:
    - name: Work out the release
      id: plan
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        GH_REPO: ${{ github.repository }}
      run: |
        fork="$(gh api "repos/$GH_REPO" --jq .fork)"
        KSKILL_FORK="$fork" bash "$KSKILL_HOME/.github/scripts/kskill-release.sh" prepare "$RUNNER_TEMP/release"

    - name: Require the App secrets
      if: steps.plan.outputs.status != 'skip' && inputs.token == ''
      shell: bash
      run: |
        echo "::error::Variable KSKILL_TOKEN_BROKER_URL is not set: its token pushes the release branch and writes the release PR."
        exit 1

    - name: Close the release PR, nothing is left to ship
      if: steps.plan.outputs.status == 'none'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        GH_REPO: ${{ github.repository }}
        BRANCH: kskill/release
        REASON: ${{ steps.plan.outputs.reason }}
      run: |
        for number in $(gh pr list --head "$BRANCH" --base prod --state open --json number --jq '.[].number'); do
          gh pr close "$number" --comment "Nothing left to release: $REASON. Closed by \`Kheona Skill · Main\`/\`· Ship\`/\`· Inbox\` (release-pr)."
        done
        if head="$(git rev-parse -q --verify "origin/$BRANCH")"; then
          git push --force-with-lease="$BRANCH:$head" origin ":refs/heads/$BRANCH" || true
        fi
        echo "Nothing to release: $REASON." >> "$GITHUB_STEP_SUMMARY"

    - name: Push the release branch and open or update the PR
      if: steps.plan.outputs.status == 'open'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        GH_REPO: ${{ github.repository }}
        BRANCH: kskill/release
        HEAD_SHA: ${{ steps.plan.outputs.head }}
      run: |
        set -euo pipefail
        out="$RUNNER_TEMP/release"
        current="$(git rev-parse -q --verify "origin/$BRANCH" || true)"
        if [ "$current" != "$HEAD_SHA" ]; then
          git push --force origin "$HEAD_SHA:refs/heads/$BRANCH"
        fi
        gh label create ship --color 0E8A16 \
          --description "Ships the release PR's head to prod (Kheona Skill · CD · Push to prod)" >/dev/null 2>&1 || true
        number="$(gh pr list --head "$BRANCH" --base prod --state open --json number --jq '.[0].number // empty')"
        if [ -z "$number" ]; then
          gh pr create --draft --base prod --head "$BRANCH" --title "$(cat "$out/title")" --body-file "$out/body.md"
        else
          gh pr edit "$number" --title "$(cat "$out/title")" --body-file "$out/body.md"
          # A label left from before the head moved approves nothing: the next `ship` must be added anew.
          if [ "$current" != "$HEAD_SHA" ]; then gh pr edit "$number" --remove-label ship >/dev/null 2>&1 || true; fi
        fi
        { echo "### $(cat "$out/title")"; echo; echo "Head \`$HEAD_SHA\` ($(cat "$out/mode") mode). Ship: add the label \`ship\` to the release PR."; } >> "$GITHUB_STEP_SUMMARY"
